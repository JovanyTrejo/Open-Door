<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Door</title>

  <!-- tab icon -->
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <style>
    body{
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #808080;
    }

    .home-button{
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 8px 18px;
        background-color: #27292e;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }

    .home-button:hover{
        background-color: #336c85;
    }

    .login-box{
        text-align: center;
        margin-top: 60px;
    }

    .login-box img{
        display: block;
        margin: 0 auto;
    }

    .login-form{
        display: flex;
        flex-direction: column;
        width: 280px;
        margin: 0 auto;
        text-align: left;
    }

    .login-form label{
        margin-top: 12px;
        margin-bottom: 4px;
        font-weight: bold;
    }

    .login-form input{
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background-color: #27292e;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .login-form button:hover{
        background-color: #336c85;
    }
    </style>
</head>

<body>
    <a ref="home.html" class="home-button">Home</a>
    <div class="login-box">
<img src="images/open_door_logo_transparent.png" alt="Open Door logo" width="100">  <h1>Login Page</h1>
<form class="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder= "you@example.com" required>

    <label for ="password">Password</label>
    <input type="password" id="password" name="password" placeholder= "Enter your password" required>
    <button type="submit">Login</button>
</form>
</div>
</body>
</html>
