<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Door</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #808080;
        }

        .login-button{
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 18px;
            background-color: #27292e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        
        .login-button:hover{
            background-color: #336c85;
        }

        .contact-box{
            position: absolute;
            top: 70px;
            right: 20px;
            width: 240px;
            padding: 14px 16px;
            background-color: #27292e;
            color: white;
            border: 2px solid #336c85;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .contact-box h3{
            margin: 0 0 8px 0;
            font-size: 16px;
        }

        .contact-box a{
            color: #9fd3e8;
        }

        @media (max-width: 700px){
            .contact-box{
                position: static;
                width: 260px;
                max-width: calc(100% - 40px);
                margin: 70px 20px 20px auto;
                padding: 10px 12px;
                font-size: 13px;
            }

            .contact-box h3{
                font-size: 14px;
            }
        }
    </style> 
</head>
<body>
    <a href="login.html" class="login-button">Login</a>

    <h1>Open Door</h1>
    <p>Your page content goes here.</p>

    <div class="contact-box">
    <h3>Contact Us</h3>
        <p><strong>Phone:</strong> <a href="tel:0000000000">(000) 000-0000</a></p>
        <p><strong>Email:</strong> <a href="mailto:example@csusb.edu">example@csusb.edu</a></p>
        <p><strong>Location:</strong> [Building and room number]</p>
        <p><strong>Hours:</strong> Mon–Fri, 8:00 AM – 5:00 PM</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
